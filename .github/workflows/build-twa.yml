name: Build Android TWA

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Website URL (HTTPS)'
        required: true
        default: 'https://qariclinic.github.io/azan-watch/azan-watch.html'
      package_id:
        description: 'Android package ID'
        required: true
        default: 'com.qariclinic.azanwatch'
      app_name:
        description: 'App name'
        required: true
        default: 'Azan Watch'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap
        run: |
          mkdir -p twa
          cd twa
          bubblewrap init \
            --manifest "${{ github.event.inputs.site_url }}/manifest.json" \
            --directory . \
            --yes

      - name: Set package ID and app name
        run: |
          cd twa
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            cfg.packageId = '${{ github.event.inputs.package_id }}';
            cfg.name = '${{ github.event.inputs.app_name }}';
            cfg.launcherName = '${{ github.event.inputs.app_name }}';
            cfg.host = new URL('${{ github.event.inputs.site_url }}').host;
            cfg.startUrl = new URL('${{ github.event.inputs.site_url }}').pathname;
            fs.writeFileSync('twa-manifest.json', JSON.stringify(cfg, null, 2));
          "

      - name: Build APK
        run: |
          cd twa
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azanwatch-apk
          path: twa/*.apk
          if-no-files-found: error
